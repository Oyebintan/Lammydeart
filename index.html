<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately NO viewport-fit=cover. That extends the layout viewport up
         into the safe area, but in ordinary iOS Safari browsing
         env(safe-area-inset-top) resolves to 0, so nothing compensates and page
         content ends up painting behind the status bar. Left off, the viewport
         starts below the status bar and theme-color tints that strip instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tints the mobile browser's own chrome (the iOS status-bar strip above the
         page and the toolbar strip below it) to match the site background.
         Without this Safari leaves those strips translucent, so page content is
         visible sliding behind them while scrolling. -->
    <meta name="theme-color" content="#03050a" />
    <!-- Stops the white flash before first paint and keeps native UI dark -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

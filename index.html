<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required here, not optional.
         Without it the layout viewport stops below the status bar, but the page
         still PAINTS up into that strip once Safari collapses its top toolbar —
         and `position: fixed; top: 0` anchors to the layout viewport, so the nav
         sits below the strip and scrolling content shows above it.
         With cover, the layout viewport covers the whole screen, so the nav's
         opaque background reaches the true top edge. env(safe-area-inset-*) only
         resolves to real values under cover, which is what the padding on the
         nav, hero, page headers and footer relies on to stay clear of the
         status bar and home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tints the mobile browser's own chrome (the iOS status-bar strip above the
         page and the toolbar strip below it) to match the site background.
         Without this Safari leaves those strips translucent, so page content is
         visible sliding behind them while scrolling. -->
    <meta name="theme-color" content="#000000" />
    <!-- Stops the white flash before first paint and keeps native UI dark -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Clash Display comes from a third host and its stylesheet is
         render-blocking; without this the connection is only opened once the
         parser reaches the link below. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Lammydeart — Graphic & Web Designer</title>
    <meta name="description" content="Portfolio of Lammy (Olamide) — a graphic and web designer crafting bold visual identities and clean, functional websites." />
    <link rel="canonical" href="https://thelammydeart.vercel.app/" />
    <meta property="og:title" content="Lammydeart — Graphic & Web Designer" />
    <meta property="og:description" content="Portfolio of Lammy (Olamide) — a graphic and web designer crafting bold visual identities and clean, functional websites." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thelammydeart.vercel.app/" />
    <!-- Without og:image, sharing the portfolio on WhatsApp or X produced a
         card with no artwork — which for a design portfolio is the worst place
         to show nothing. Absolute URL is required; scrapers do not resolve
         relative paths. 1200x630 is the standard ratio both platforms crop to. -->
    <meta property="og:image" content="https://thelammydeart.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lammydeart — bold visual identities, clean functional websites." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lammydeart — Graphic & Web Designer" />
    <meta name="twitter:description" content="Portfolio of Lammy (Olamide) — a graphic and web designer crafting bold visual identities and clean, functional websites." />
    <meta name="twitter:image" content="https://thelammydeart.vercel.app/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
